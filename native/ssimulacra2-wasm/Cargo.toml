[package]
name = "ssim-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the version ssimulacra2 0.5.0 resolves to. yuvxyb 0.4.2 drifts up to 0.033 from the native binary.
yuvxyb = "=0.4.0"
wasm-bindgen = "=0.2.129"

[dev-dependencies]
# The scorer in src/scorer.rs and src/blur/ is vendored from ssimulacra2 0.5.0 (BSD-2-Clause, see the file headers and
# NOTICE). The upstream crate is kept here, out of the wasm build, as the reference for tests/bit_identical.rs.
# Same version and features as ssimulacra2_rs 0.5.2 uses (no rayon).
ssimulacra2 = { version = "=0.5.0", default-features = false }
# Decodes the real images for tests/bit_identical.rs and makes JPEG distortions of them.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
debug = false
strip = true
