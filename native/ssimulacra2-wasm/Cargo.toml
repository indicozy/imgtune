[package]
name = "ssim-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same library and version as ssimulacra2_rs 0.5.2 (which depends on ssimulacra2 =0.5.0 with default-features = false, i.e. no rayon).
ssimulacra2 = { version = "=0.5.0", default-features = false }
# Pinned to the version ssimulacra2 0.5.0 resolves to. yuvxyb 0.4.2 drifts up to 0.033 from the native binary.
yuvxyb = "=0.4.0"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
debug = false
strip = true
