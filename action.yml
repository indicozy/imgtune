name: "imgtune scan"
description: "Scan the images of live pages and comment their image waste on the pull request"
inputs:
  urls:
    description: "Page URLs to scan, separated by newlines or spaces"
    required: true
  fail-over:
    description: "Exit 3 when a page's exact + est. share is above this percentage (default: never fail)"
    required: false
    default: ""
  comment:
    description: "Post or update the pull request comment. On pull_request events the event's pull request is used; on other events (such as deployment_status) the open pull request of the commit is used"
    required: false
    default: "true"
  viewports:
    description: "Comma-separated viewport names (default: all six)"
    required: false
    default: ""
  github-token:
    description: "Token that posts the pull request comment"
    required: false
    default: ${{ github.token }}
  comment-author:
    description: "Login of the account that owns the imgtune comment; only its comments are updated. Set it to your app's bot login when you pass a custom token"
    required: false
    default: "github-actions[bot]"
runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4 # TODO pin to SHA
      with:
        node-version: 20

    # The action builds itself: dist/ is not committed. The lockfile is pnpm's, so pnpm installs and builds.
    - name: Build imgtune
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm run build

    - name: Install Chromium
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm exec playwright install --with-deps chromium

    - name: Scan
      id: scan
      shell: bash
      env:
        IMGTUNE_URLS: ${{ inputs.urls }}
        IMGTUNE_FAIL_OVER: ${{ inputs.fail-over }}
        IMGTUNE_VIEWPORTS: ${{ inputs.viewports }}
        IMGTUNE_ACTION_PATH: ${{ github.action_path }}
        IMGTUNE_RESULTS: ${{ runner.temp }}/imgtune
      run: |
        mkdir -p "$IMGTUNE_RESULTS"
        args=()
        set -f
        for url in $IMGTUNE_URLS; do args+=("$url"); done
        set +f
        if [ -n "$IMGTUNE_FAIL_OVER" ]; then args+=(--fail-over "$IMGTUNE_FAIL_OVER"); fi
        if [ -n "$IMGTUNE_VIEWPORTS" ]; then args+=(--viewports "$IMGTUNE_VIEWPORTS"); fi
        node "$IMGTUNE_ACTION_PATH/dist/cli.js" scan "${args[@]}" \
          --out "$IMGTUNE_RESULTS/json" \
          --markdown "$IMGTUNE_RESULTS/comment.md" \
          --summary-json "$IMGTUNE_RESULTS/summary.json"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        # The job's result is decided by the last step, after the comment is posted.
        exit 0

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        IMGTUNE_RESULTS: ${{ runner.temp }}/imgtune
        IMGTUNE_REPO: ${{ github.repository }}
        IMGTUNE_EVENT: ${{ github.event_name }}
        IMGTUNE_PR: ${{ github.event.pull_request.number }}
        IMGTUNE_SHA: ${{ github.event.deployment_status.deployment.sha || github.sha }}
        IMGTUNE_AUTHOR: ${{ inputs.comment-author }}
      run: |
        if [ ! -s "$IMGTUNE_RESULTS/comment.md" ]; then
          echo "::warning::imgtune wrote no summary, so no comment was posted"
          exit 0
        fi
        pr="$IMGTUNE_PR"
        if [ "$IMGTUNE_EVENT" != "pull_request" ]; then
          pr=$(gh api "repos/$IMGTUNE_REPO/commits/$IMGTUNE_SHA/pulls" \
            --jq '[.[] | select(.state=="open")][0].number // empty')
        fi
        if [ -z "$pr" ]; then
          echo "imgtune: no open pull request for commit $IMGTUNE_SHA, so no comment was posted"
          exit 0
        fi
        body="$IMGTUNE_RESULTS/comment-body.md"
        { echo "<!-- imgtune-scan -->"; cat "$IMGTUNE_RESULTS/comment.md"; } > "$body"
        id=$(gh api --paginate "repos/$IMGTUNE_REPO/issues/$pr/comments" \
          --jq '.[] | select(.user.login == env.IMGTUNE_AUTHOR and (.body | startswith("<!-- imgtune-scan -->"))) | .id' | head -n 1)
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$IMGTUNE_REPO/issues/comments/$id" -F "body=@$body" > /dev/null
        else
          gh api --method POST "repos/$IMGTUNE_REPO/issues/$pr/comments" -F "body=@$body" > /dev/null
        fi

    - name: Exit with the scan's code
      if: always()
      shell: bash
      env:
        IMGTUNE_EXIT: ${{ steps.scan.outputs.exit-code }}
      run: exit "${IMGTUNE_EXIT:-1}"
